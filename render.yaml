services:
  - type: web
    name: whatsapp-ai-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: TYPING_DELAY_ENABLED
        value: "false"
      - key: FALLBACK_TO_SQLITE
        value: "true"
      - key: PORT
        value: 3001
